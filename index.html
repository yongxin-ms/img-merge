<style>
  :root {
    --bg: #f7f7f8;
    --card-bg: #ffffff;
    --border: #e2e2e6;
    --text: #1f2023;
    --text-muted: #6b6b72;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .container { max-width: 880px; margin: 0 auto; padding: 32px 20px 60px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 36px 20px;
    text-align: center;
    color: var(--text-muted);
    cursor: pointer;
    background: var(--card-bg);
    transition: border-color .15s, background .15s;
  }
  .dropzone.dragover { border-color: var(--accent); background: #eff6ff; color: var(--accent); }
  .dropzone strong { color: var(--text); }
  .file-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin: 20px 0;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    cursor: grab;
    position: relative;
    user-select: none;
    transition: transform .12s, box-shadow .12s, opacity .12s;
  }
  .card.dragging { opacity: .4; }
  .card.drag-over { box-shadow: 0 0 0 2px var(--accent) inset; }
  .card .order-badge {
    position: absolute; top: 4px; left: 4px;
    background: var(--accent); color: #fff;
    font-size: 11px; font-weight: 600;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; z-index: 2;
  }
  .card .pdf-badge {
    position: absolute; top: 4px; right: 4px;
    background: rgba(0, 0, 0, .65); color: #fff;
    font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 10px; z-index: 2;
  }
  .card img {
    width: 100%; height: 110px; object-fit: cover;
    border-radius: 6px; display: block; background: #f0f0f2; pointer-events: none;
  }
  .card .fname {
    font-size: 11px; color: var(--text-muted); margin-top: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .actions { display: flex; justify-content: space-between; margin-top: 6px; gap: 4px; }
  .card .actions button {
    flex: 1; font-size: 12px; padding: 3px 0;
    border: 1px solid var(--border); background: #fafafa;
    border-radius: 5px; cursor: pointer; color: var(--text);
  }
  .card .actions button:hover { background: #f0f0f2; }
  .card .actions button.remove { color: var(--danger); }
  .controls {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 8px;
  }
  .controls label { font-size: 13px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  .controls select, .controls input[type="text"] {
    font-size: 13px; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 6px; background: #fff; color: var(--text);
  }
  #outName {
    width: 30ch;
    max-width: 100%;
  }
  .spacer { flex: 1; }
  button.primary {
    background: var(--accent); color: #fff; border: none; padding: 9px 18px;
    border-radius: 7px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { background: #b7c6ee; cursor: not-allowed; }
  button.secondary {
    background: #fff; color: var(--text); border: 1px solid var(--border);
    padding: 9px 16px; border-radius: 7px; font-size: 14px; cursor: pointer;
  }
  button.secondary:hover { background: #f0f0f2; }
  #status { margin-top: 12px; font-size: 13px; color: var(--text-muted); min-height: 18px; }
  #status.error { color: var(--danger); }
  #status.ok { color: #15803d; }
  .empty-hint { text-align: center; color: var(--text-muted); font-size: 13px; padding: 20px 0; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">
  <h1>图片合并为 PDF</h1>
  <p class="subtitle">全部在浏览器本地处理，图片不会上传到任何服务器。拖拽卡片或用按钮调整顺序，再导出 PDF。</p>

  <div id="dropzone" class="dropzone">
    <div><strong>点击选择图片或 PDF</strong> 或将文件拖拽到此处（支持多选，JPG / PNG / WebP / PDF 等；每个 PDF 作为一个整体插入，内部页面顺序不变）</div>
  </div>
  <input type="file" id="fileInput" multiple accept="image/*,application/pdf,.pdf">

  <div id="fileList" class="file-list"></div>
  <div id="emptyHint" class="empty-hint">还没有添加图片</div>

  <div class="controls">
    <label>页面模式
      <select id="pageMode">
        <option value="uniform" selected>统一宽度，高度按比例缩放（推荐）</option>
        <option value="fit">按图片原始尺寸（每页大小=对应图片大小）</option>
        <option value="a4">统一为 A4，图片居中缩放</option>
      </select>
    </label>
    <label>文件名
      <input type="text" id="outName" value="merged" size="30">
    </label>
    <div class="spacer"></div>
    <button class="secondary" id="clearBtn">清空</button>
    <button class="primary" id="generateBtn" disabled>生成并下载 PDF</button>
  </div>
  <div id="status"></div>
</div>

  // 不会打散成一页一页各自排序；PDF 内部页面之间的先后顺序始终保持原始顺序不变，
  // 生成最终 PDF 时再展开成实际的页面序列。
  let items = [];
  let idCounter = 0;
  let dragSrcIndex = null;

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileListEl = document.getElementById('fileList');
  const emptyHint = document.getElementById('emptyHint');
  const generateBtn = document.getElementById('generateBtn');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const pageModeEl = document.getElementById('pageMode');
  const outNameEl = document.getElementById('outName');

  // 默认文件名里带上当前时间，方便多次导出时不用手动改名避免互相覆盖。
  // 页面打开时先填一个"此刻"的时间；如果用户后面一直没改过这个输入框，
  // 生成 PDF 的时候会用"点击生成那一刻"的时间重新填一次，保证文件名对应
  // 的是真正下载的时间，而不是老早打开页面时的时间。如果用户自己改过
  // 文件名，则完全尊重用户输入，不会再被自动覆盖。
  function pad2(n) {
    return String(n).padStart(2, '0');
  }
  function formatTimestamp(d) {
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) +
      '_' + pad2(d.getHours()) + '-' + pad2(d.getMinutes()) + '-' + pad2(d.getSeconds());
  }
  let autoDefaultName = 'merged_' + formatTimestamp(new Date());
  outNameEl.value = autoDefaultName;

  // ---- 内嵌依赖库的解压与延迟加载 ----
  // jsPDF、pdf.js 解析引擎、pdf.js 的 Worker 脚本这三个库体积都不小，直接把源码原文
  // 内嵌进页面会让文件膨胀到接近 2MB。这三份都是高度可压缩的文本（压缩后大概只有原始
  // 体积的 1/4），所以构建时先用 gzip 压一遍再转成 base64 存成不会被浏览器执行的
  // <script type="text/plain"> 块，真正用到的时候（比如第一次点生成 PDF，或第一次选中
  // 一个 PDF 文件）才用浏览器原生的 DecompressionStream API 现场解压出来再执行/使用。
  // DecompressionStream 从 2023 年 5 月起已经是所有主流浏览器（含 iOS Safari 16.4+）都
  // 支持的 baseline 能力，不需要额外再内嵌一份 JS 解压库。加了这一层以后，各个功能第一次
  // 用到时会有一次几十到一两百毫秒的解压耗时，之后会缓存结果，不会重复解压。
  function decompressionSupported() {
    return typeof DecompressionStream === 'function';
  }

  async function decompressGzipBase64ToText(base64Text) {
    const binary = atob(base64Text);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const blob = await new Response(stream).blob();
    return blob.text();
  }

  function getEmbeddedB64(elId) {
    const el = document.getElementById(elId);
    if (!el) throw new Error('缺少内嵌资源：' + elId);
    return el.textContent;
  }

  // 把解压出来的库源码变成真正在页面里执行的 <script>：动态创建 script 元素并插入
  // DOM，不带 src/async/type=module，浏览器会像解析普通内联脚本一样立刻同步执行它，
  // 执行完之后 UMD 包装会把 jsPDF / pdfjsLib 挂到 window 上，和原来直接内嵌一样。
  function runScriptText(codeText) {
    const s = document.createElement('script');
    s.textContent = codeText;
    document.head.appendChild(s);
    document.head.removeChild(s);
  }

  function requireDecompressionSupport() {
    if (!decompressionSupported()) {
      throw new Error('当前浏览器版本过旧，不支持本工具需要的压缩解压功能（需要 Safari 16.4 / Chrome 80 / Firefox 113 及以上版本），请升级浏览器后重试。');
    }
  }

  let jspdfReadyPromise = null;
  function ensureJsPdfLoaded() {
    if (!jspdfReadyPromise) {
      jspdfReadyPromise = (async () => {
        requireDecompressionSupport();
        const code = await decompressGzipBase64ToText(getEmbeddedB64('jspdfSrcB64'));
        runScriptText(code);
      })();
    }
    return jspdfReadyPromise;
  }

  let pdfjsLibReadyPromise = null;
  function ensurePdfjsLibLoaded() {
    if (!pdfjsLibReadyPromise) {
      pdfjsLibReadyPromise = (async () => {
        requireDecompressionSupport();
        const code = await decompressGzipBase64ToText(getEmbeddedB64('pdfjsLibSrcB64'));
        runScriptText(code);
      })();
    }
    return pdfjsLibReadyPromise;
  }

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('dragover');
  });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', (e) => {
    handleFiles(e.target.files);
    fileInput.value = '';
  });
  clearBtn.addEventListener('click', () => {
    items = [];
    render();
    setStatus('', '');
  });
  generateBtn.addEventListener('click', generatePdf);

  function isPdfFile(file) {
    return file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  }

  async function handleFiles(fileListObj) {
    const files = Array.from(fileListObj || []).filter(f => f.type.startsWith('image/') || isPdfFile(f));
    if (!files.length) return;

    let okCount = 0;
    let failCount = 0;
    setStatus('正在处理 ' + files.length + ' 个文件...', '');

    for (const file of files) {
      if (isPdfFile(file)) {
        try {
          const rawPages = await extractPdfPages(file);
          // 整份 PDF 只生成一张卡片，pages 数组保留页面原始顺序；
          // 排序时移动的是这张卡片整体，不会暴露"给 PDF 里每一页单独排序"的操作。
          items.push({
            id: ++idCounter,
            kind: 'pdf',
            file,
            name: file.name + '（共 ' + rawPages.length + ' 页）',
            pages: rawPages.map((p) => ({
              dataUrl: p.dataUrl,
              width: p.width,
              height: p.height,
              type: p.outputType
            }))
          });
          okCount += 1;
        } catch (err) {
          console.error('extractPdfPages failed for', file.name, err);
          failCount += 1;
        }
        render();
        continue;
      }

      try {
        const normalized = await normalizeImage(file);
        items.push({
          id: ++idCounter,
          kind: 'image',
          file,
          name: file.name,
          dataUrl: normalized.dataUrl,
          width: normalized.width,
          height: normalized.height,
          type: normalized.outputType
        });
        okCount += 1;
      } catch (err) {
        console.error('normalizeImage failed for', file.name, err);
        failCount += 1;
      }
      render();
    }

    if (failCount) {
      setStatus('已添加 ' + okCount + ' 个文件，' + failCount + ' 个文件无法解析已跳过。', 'error');
    } else {
      setStatus('', '');
    }
  }

  // 移动端浏览器（尤其是 iOS Safari）对单张 canvas 能容纳的像素总数有上限，具体数值
  // 因机型而异，但现在手机随便一张照片就可能超过 4000 万像素（比如新款 iPhone 主摄
  // 8064x6048）。一旦超限，Safari 不会报错，而是默默截断画出来的内容——表现出来就是
  // "图片被裁切了"。这里给最长边设一个安全上限，超过就等比缩小之后再画到 canvas 上，
  // 保证送进 canvas 的像素量在任何设备上都不会触发这个截断问题。4096px 足够覆盖绝大多数
  // 屏幕查看和打印场景，非必要不需要保留手机原图那种远超打印/阅读需求的原始分辨率。
  const MAX_CANVAS_DIMENSION = 4096;

  // 手机拍的照片（尤其是 iPhone）常常带有 EXIF 旋转信息：文件里存的是传感器原始像素，
  // 靠一个 Orientation 标记告诉看图软件"显示时要转多少度"。<img> 的 naturalWidth/Height
  // 在不同浏览器里对这个标记的处理不一致，而 canvas/PDF 生成时如果又没转，就会出现
  // 页面尺寸算对了、但图片内容方向或长宽比对不上的问题（部分 iPhone 照片还是 HEIC 格式，
  // 同样需要先解码成标准位图）。这里统一用 createImageBitmap 强制按 EXIF 校正方向解码，
  // 再画到 canvas 上重新导出，得到的就是已经"烧录"好正确方向、不再依赖 EXIF 的干净图片。
  async function normalizeImage(file) {
    if (typeof createImageBitmap === 'function') {
      try {
        const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });

        let targetW = bitmap.width;
        let targetH = bitmap.height;
        const longestSide = Math.max(targetW, targetH);
        if (longestSide > MAX_CANVAS_DIMENSION) {
          const scale = MAX_CANVAS_DIMENSION / longestSide;
          targetW = Math.max(1, Math.round(targetW * scale));
          targetH = Math.max(1, Math.round(targetH * scale));
        }

        const canvas = document.createElement('canvas');
        canvas.width = targetW;
        canvas.height = targetH;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        if ('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
        // 无论是否缩放，drawImage 的目标尺寸都显式指定为整张 canvas，
        // 保证画出来的是完整的、按比例缩放后的整张图，而不是原始像素的一部分。
        ctx.drawImage(bitmap, 0, 0, targetW, targetH);
        if (typeof bitmap.close === 'function') bitmap.close();

        const outputType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
        const dataUrl = outputType === 'image/jpeg'
          ? canvas.toDataURL(outputType, 0.92)
          : canvas.toDataURL(outputType);

        return { dataUrl, width: canvas.width, height: canvas.height, outputType };
      } catch (err) {
        console.warn('createImageBitmap 解码失败，改用兼容模式：', file.name, err);
      }
    }
    return legacyReadImage(file);
  }

  // 兼容模式：老浏览器不支持 createImageBitmap 时的兜底方案（不做 EXIF 校正）。
  function legacyReadImage(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        const img = new Image();
        img.onload = () => {
          resolve({
            dataUrl,
            width: img.naturalWidth,
            height: img.naturalHeight,
            outputType: file.type || 'image/jpeg'
          });
        };
        img.onerror = () => reject(new Error('无法解析为图片'));
        img.src = dataUrl;
      };
      reader.onerror = () => reject(new Error('文件读取失败'));
      reader.readAsDataURL(file);
    });
  }

  // ---- PDF 导入：把 PDF 的每一页渲染成一张图片，之后完全复用现有的图片流程 ----
  // （缩略图、拖拽/按钮排序、统一宽度/原始尺寸/A4 三种页面模式等都对图片和 PDF 页面
  // 一视同仁）。pdf.js 的解析/渲染跑在 Worker 线程里，Worker 脚本本身比较大（约 1MB），
  // 为了保持"整个工具就是一个不联网、不依赖外部文件的单文件页面"，把 Worker 源码也
  // 压缩后内嵌在页面里（见下方 <script type="text/plain" id="pdfjsWorkerSrcB64">，浏览器
  // 不会执行它，只是把压缩过的源码文本带在页面上），真正使用时才现场解压、转成 Blob URL
  // 交给 pdf.js。
  let pdfWorkerReadyPromise = null;
  function ensurePdfWorkerConfigured() {
    if (!pdfWorkerReadyPromise) {
      pdfWorkerReadyPromise = (async () => {
        requireDecompressionSupport();
        const workerCode = await decompressGzipBase64ToText(getEmbeddedB64('pdfjsWorkerSrcB64'));
        const blob = new Blob([workerCode], { type: 'text/javascript' });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
      })();
    }
    return pdfWorkerReadyPromise;
  }

  // PDF 页面渲染成图片时同样要控制像素上限（原因和 normalizeImage 里的
  // MAX_CANVAS_DIMENSION 一致：避免触发移动端浏览器的 canvas 像素上限）。目标分辨率
  // 定得比较宽裕（长边约 2000px，最多放大到 3 倍），兼顾清晰度和文件体积，具体最终
  // 页面尺寸仍然由 generatePdf() 里统一的缩放逻辑决定。
  const PDF_RENDER_TARGET_PX = 2000;

  async function extractPdfPages(file) {
    await ensurePdfjsLibLoaded();
    await ensurePdfWorkerConfigured();
    const buf = await file.arrayBuffer();
    const loadingTask = window.pdfjsLib.getDocument({ data: buf });
    const pdfDoc = await loadingTask.promise;
    const results = [];
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      results.push(await renderPdfPage(page));
    }
    return results;
  }

  async function renderPdfPage(page) {
    const baseViewport = page.getViewport({ scale: 1 });
    let scale = PDF_RENDER_TARGET_PX / Math.max(baseViewport.width, baseViewport.height);
    scale = Math.min(Math.max(scale, 1), 3);
    let viewport = page.getViewport({ scale });

    const longestSide = Math.max(viewport.width, viewport.height);
    if (longestSide > MAX_CANVAS_DIMENSION) {
      scale *= MAX_CANVAS_DIMENSION / longestSide;
      viewport = page.getViewport({ scale });
    }

    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(viewport.width));
    canvas.height = Math.max(1, Math.round(viewport.height));
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;

    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    return { dataUrl, width: canvas.width, height: canvas.height, outputType: 'image/jpeg' };
  }

  function moveItem(index, delta) {
    const target = index + delta;
    if (target < 0 || target >= items.length) return;
    const tmp = items[index];
    items[index] = items[target];
    items[target] = tmp;
    render();
  }

  function removeItem(index) {
    items.splice(index, 1);
    render();
  }

  function render() {
    fileListEl.innerHTML = '';
    emptyHint.style.display = items.length ? 'none' : 'block';
    generateBtn.disabled = items.length === 0;

    items.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.draggable = true;
      card.dataset.index = String(index);

      card.addEventListener('dragstart', (e) => {
        dragSrcIndex = index;
        card.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      card.addEventListener('dragend', () => {
        card.classList.remove('dragging');
        document.querySelectorAll('.card').forEach(c => c.classList.remove('drag-over'));
      });
      card.addEventListener('dragover', (e) => {
        e.preventDefault();
        card.classList.add('drag-over');
      });
      card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
      card.addEventListener('drop', (e) => {
        e.preventDefault();
        card.classList.remove('drag-over');
        const targetIndex = index;
        if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;
        const [moved] = items.splice(dragSrcIndex, 1);
        items.splice(targetIndex, 0, moved);
        dragSrcIndex = null;
        render();
      });

      const badge = document.createElement('div');
      badge.className = 'order-badge';
      badge.textContent = String(index + 1);
      card.appendChild(badge);

      const thumb = item.kind === 'pdf' ? item.pages[0] : item;

      const img = document.createElement('img');
      img.src = thumb.dataUrl;
      img.alt = item.name;
      card.appendChild(img);

      if (item.kind === 'pdf') {
        const pdfBadge = document.createElement('div');
        pdfBadge.className = 'pdf-badge';
        pdfBadge.textContent = 'PDF·' + item.pages.length + '页';
        card.appendChild(pdfBadge);
      }

      const fname = document.createElement('div');
      fname.className = 'fname';
      fname.title = item.name;
      fname.textContent = item.name;
      card.appendChild(fname);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const upBtn = document.createElement('button');
      upBtn.textContent = '↑';
      upBtn.title = '前移';
      upBtn.disabled = index === 0;
      upBtn.addEventListener('click', (e) => { e.stopPropagation(); moveItem(index, -1); });

      const downBtn = document.createElement('button');
      downBtn.textContent = '↓';
      downBtn.title = '后移';
      downBtn.disabled = index === items.length - 1;
      downBtn.addEventListener('click', (e) => { e.stopPropagation(); moveItem(index, 1); });

      const delBtn = document.createElement('button');
      delBtn.textContent = '✕';
      delBtn.title = '移除';
      delBtn.className = 'remove';
      delBtn.addEventListener('click', (e) => { e.stopPropagation(); removeItem(index); });

      actions.appendChild(upBtn);
      actions.appendChild(downBtn);
      actions.appendChild(delBtn);
      card.appendChild(actions);

      fileListEl.appendChild(card);
    });
  }

  function inferFormat(type) {
    if (type.includes('png')) return 'PNG';
    if (type.includes('webp')) return 'WEBP';
    return 'JPEG';
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = kind || '';
  }

  // 把卡片列表（items，图片和 PDF 混在一起，PDF 是一张卡片代表一整份文件）
  // 展开成最终要生成的、按顺序排好的页面列表：图片卡片展开成它自己这一页，
  // PDF 卡片按其内部原始页面顺序依次展开成多页。后续的页面尺寸计算、生成 PDF
  // 逻辑统一只需要处理这个展开后的"页面"列表，不用关心某一页原来是图片还是
  // 来自某份 PDF。
  function flattenPages() {
    const flat = [];
    items.forEach((it) => {
      if (it.kind === 'pdf') {
        it.pages.forEach((p) => flat.push({ dataUrl: p.dataUrl, width: p.width, height: p.height, type: p.type }));
      } else {
        flat.push({ dataUrl: it.dataUrl, width: it.width, height: it.height, type: it.type });
      }
    });
    return flat;
  }

  async function generatePdf() {
    if (!items.length) return;
    generateBtn.disabled = true;
    setStatus('正在生成 PDF...', '');

    try {
      await ensureJsPdfLoaded();
      const { jsPDF } = window.jspdf;

      const mode = pageModeEl.value;
      const flatPages = flattenPages();
      if (!flatPages.length) {
        setStatus('没有可生成的页面内容。', 'error');
        return;
      }
      let doc;

      if (mode === 'uniform' || mode === 'fit') {
        // PDF 页面用的 'px' 单位在 jsPDF 里换算成 pt 的比例是 4/3。之前直接拿手机照片的
        // 原始像素（可以到 4096px）当页面尺寸用，换算成实际物理页面能到 70~140 英寸——
        // 桌面 Chrome、微信内置阅读器这类实现比较宽松，还能凑合显示，但 iOS 上 Safari 和
        // Chrome 共用苹果自己的 WebKit PDF 渲染引擎，遇到这么大的物理页面会把内容直接
        // 裁掉一部分，这是实测能稳定复现的差异：同一份文件，Windows 桌面 Chrome、微信内置
        // 阅读器都完全正常，iOS Safari/Chrome 会裁切。这里把页面目标宽度大幅调低，并且
        // 始终对一整批页面做统一缩放（而不是每页各自单独夹紧），这样才能保证"统一宽度"
        // 在任何情况下都是真正统一的，不会因为个别极端长宽比的图（比如很长的截图）又变回
        // 各页宽度不一致。缩小物理页面尺寸对显示质量几乎没有影响——这些页面本来就是给屏幕
        // 查看或普通打印用的，不需要保留手机原图那种远超实际需求的物理尺寸。
        const TARGET_WIDTH_PX = 1600; // 统一宽度模式下的目标基准宽度
        const MAX_PAGE_LAYOUT_PX = 2400; // 任意一页任意一边的安全上限（宽或高）

        let pages;
        if (mode === 'uniform') {
          const nativeMaxWidth = Math.max(...flatPages.map((it) => it.width));
          const refWidth = Math.min(nativeMaxWidth, TARGET_WIDTH_PX);
          const rawPages = flatPages.map((it) => ({
            it,
            w: refWidth,
            h: it.height * (refWidth / it.width)
          }));
          // 统一按"这一批里最极端的那一页"来决定缩放比例，而不是逐页各自夹紧——
          // 这样才能保证所有页面的宽度完全一致，不会因为某一张图（比如很长的截图）
          // 触发夹紧后单独变窄，破坏"统一宽度"这个功能本身的意义。
          const worstLongestSide = Math.max(...rawPages.map((p) => Math.max(p.w, p.h)));
          const globalScale = worstLongestSide > MAX_PAGE_LAYOUT_PX
            ? MAX_PAGE_LAYOUT_PX / worstLongestSide
            : 1;
          pages = rawPages.map((p) => ({ it: p.it, w: p.w * globalScale, h: p.h * globalScale }));
        } else {
          // fit 模式：每一页本来就是各自独立的（页面尺寸=对应图片自己的尺寸），
          // 所以这里按每一页自己的情况单独夹紧即可，不应该因为某一张图特别大
          // 就连带影响其它页面的尺寸。
          pages = flatPages.map((it) => {
            const longest = Math.max(it.width, it.height);
            const scale = longest > MAX_PAGE_LAYOUT_PX ? MAX_PAGE_LAYOUT_PX / longest : 1;
            return { it, w: it.width * scale, h: it.height * scale };
          });
        }

        const first = pages[0];
        doc = new jsPDF({
          orientation: first.w >= first.h ? 'l' : 'p',
          unit: 'px',
          format: [first.w, first.h],
          compress: true
        });
        doc.addImage(first.it.dataUrl, inferFormat(first.it.type), 0, 0, first.w, first.h);

        for (let i = 1; i < pages.length; i++) {
          const { it, w, h } = pages[i];
          doc.addPage([w, h], w >= h ? 'l' : 'p');
          doc.addImage(it.dataUrl, inferFormat(it.type), 0, 0, w, h);
        }
      } else {
        doc = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4', compress: true });
        const pageW = 210, pageH = 297, margin = 10;
        const maxW = pageW - margin * 2, maxH = pageH - margin * 2;

        flatPages.forEach((it, i) => {
          if (i > 0) doc.addPage('a4', 'p');
          const ratio = it.width / it.height;
          let w = maxW, h = maxW / ratio;
          if (h > maxH) { h = maxH; w = maxH * ratio; }
          const x = (pageW - w) / 2;
          const y = (pageH - h) / 2;
          doc.addImage(it.dataUrl, inferFormat(it.type), x, y, w, h);
        });
      }

      // 如果用户没动过默认文件名，用"此刻"的时间重新生成一次，
      // 这样文件名对应的是实际下载的时间，而不是打开页面时的时间。
      if (outNameEl.value === autoDefaultName) {
        autoDefaultName = 'merged_' + formatTimestamp(new Date());
        outNameEl.value = autoDefaultName;
      }
      const name = (outNameEl.value || 'merged').trim().replace(/\.pdf$/i, '') || 'merged';
      doc.save(name + '.pdf');
      setStatus('已生成 ' + flatPages.length + ' 页 PDF，浏览器应已开始下载。', 'ok');
    } catch (err) {
      console.error(err);
      setStatus('生成失败：' + (err && err.message ? err.message : String(err)), 'error');
    } finally {
      generateBtn.disabled = items.length === 0;
    }
  }

  render();
})();
</script>
</body>
</html>
